<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not Found · Five Seven Five</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
  :root {
    --bg: #f3f4f2; --fg: #23262a; --muted: #8a8f94; --ink: #8a8f94; --circle-alpha: 0.16;
    --f-poem: "Shippori Mincho", "Hiragino Mincho ProN", Georgia, serif;
    --f-meta: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --d: min(44vw, 64vh); --cx: 68%; --cy: 31%; --bar-h: 7px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131515; --fg: #e6e6e1; --muted: #73787c; --ink: #73787c; --circle-alpha: 0.2; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--f-meta); overflow: hidden; }
  .stage { position: relative; height: 100%; min-height: 520px; overflow: hidden; }
  .circle { position: absolute; width: var(--d); height: var(--d); left: calc(var(--cx) - var(--d) / 2); top: calc(var(--cy) - var(--d) / 2); border-radius: 50%; background: var(--ink); opacity: var(--circle-alpha); }
  .bar { position: absolute; left: 9%; width: calc(var(--cx) - 9%); top: calc(var(--cy) - var(--bar-h) / 2); height: var(--bar-h); background: var(--ink); opacity: 0.85; }
  .poem { position: absolute; left: 52%; top: calc(var(--cy) + 7vh); max-width: min(40vw, 30rem); margin: 0; font-family: var(--f-poem); font-size: clamp(1.2rem, 2.3vw, 1.85rem); line-height: 1.9; }
  .poem span { display: block; }
  .poem span:nth-child(2) { padding-left: 1.4em; }
  .poem span:nth-child(3) { padding-left: 2.8em; }
  .poem a { color: inherit; text-decoration-color: var(--muted); text-underline-offset: 0.2em; }
  .poem a:focus-visible { outline: 1px solid var(--fg); outline-offset: 4px; }
  .meta { position: absolute; left: 9%; top: 36px; font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 700px) {
    :root { --d: min(78vw, 52vh); --cx: 60%; --cy: 30%; --bar-h: 5px; }
    .bar { left: 16px; width: calc(var(--cx) - 16px); }
    .meta { left: 16px; }
    .poem { left: 16px; right: 16px; max-width: none; top: calc(var(--cy) + var(--d) * 0.22); font-size: clamp(1.1rem, 5.2vw, 1.4rem); }
  }
</style>
<body>
<div class="stage">
  <div class="meta">404 · Not found</div>
  <div class="circle" aria-hidden="true"></div>
  <div class="bar" aria-hidden="true"></div>
  <p class="poem">
    <span>the path you followed</span>
    <span>leads to an empty garden</span>
    <span><a href="/">return to the gate</a></span>
  </p>
</div>
</body>
</html>
